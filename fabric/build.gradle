import net.darkhax.curseforgegradle.TaskPublishCurseForge

plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
    id "com.modrinth.minotaur"
    id "net.darkhax.curseforgegradle"
}
def modrinthToken = System.getenv("MODRINTH_TOKEN")
def cfToken = System.getenv("CURSEFORGE_TOKEN")

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

modrinth {
    token = modrinthToken
    projectId = property("modrinth_project_id").toString()
    versionNumber = version.toString()
    versionType = property("versionType").toString()
    uploadFile = tasks.findByName("remapJar") ?: tasks.named("jar")
    gameVersions = [property("minecraft_version").toString()]
    loaders = ["neoforge"]
    changelog = rootProject.file("CHANGELOG.md").text

}
tasks.named('sourcesJar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
tasks.register('publishCurseForge', TaskPublishCurseForge) {
    apiToken = cfToken
    def projectId = ("${curseforge_project_id}").toLong()
    def mainFile = upload(projectId, tasks.findByName("remapJar") ?: tasks.named("jar"))
    mainFile.displayName = "Redden's Stone Lanterns Reconstructed v${version}"
    mainFile.releaseType = "${versionType}"
    mainFile.changelogType = "markdown"
    mainFile.changelog = rootProject.file("CHANGELOG.md").text
    mainFile.addGameVersion("${minecraft_version}")
    mainFile.addModLoader("NeoForge")
    mainFile.addEnvironment("Server")
    mainFile.addEnvironment("Client")
}

tasks.named('publishCurseForge').configure {
    dependsOn tasks.findByName("remapJar") ?: tasks.named("jar")
}
dependencies {
    minecraft("com.mojang:minecraft:${minecraft_version}")
    implementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
    implementation("net.fabricmc.fabric-api:fabric-api:${fabric_version}")
    implementation ("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}")
    implementation ("com.terraformersmc:modmenu:${modmenu_version}")

    /*compileOnly("mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}")
    runtimeOnly("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}")

    compileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${rei_version}"
    runtimeOnly "me.shedaniel:RoughlyEnoughItems-fabric:${rei_version}"*/
}
fabricApi {
    configureDataGeneration() {
        outputDirectory = project(':common').file('src/main/generated')
        createRunConfiguration = true
        modId = "educationeditionjavafied"
        strictValidation = true
        addToResources = true
        client = true
    }
}
loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}
repositories {
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/" }
    maven {
        // location of the maven that hosts JEI files since January 2023
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        // location of a maven mirror for JEI files, as a fallback
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven { url "https://maven.shedaniel.me" }
}
sourceSets {
    main {
        resources {
            srcDirs += project(':common').file('src/main/generated')
        }
    }
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
